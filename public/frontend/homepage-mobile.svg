  <g fill="#A0A0A0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">
    <text x="195" y="656">and more</text>
  </g>
  <path d="M24 786 Q195 690 366 786" fill="none" stroke="#0876E8" stroke-width="1.2" opacity=".75"/>
