<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" role="img" aria-labelledby="title desc">
  <title id="title">MILION mobile homepage concept</title>
  <desc id="desc">Minimal black mobile landing page for MILION with the official four-point star mascot, a Get Started navigation action, the Beyond Every Strategy headline, and supported AI chat provider names.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#159BFF"/>
      <stop offset="1" stop-color="#0876E8"/>
    </linearGradient>
  </defs>
  <rect width="390" height="844" fill="#000000"/>
  <g fill="#FFFFFF">
    <path d="M39 31 C42 23 46 19 51 19 C56 19 60 23 63 31 C70 49 83 59 98 64 C102 66 104 68 104 72 C104 76 102 78 98 80 C83 85 70 96 63 113 C60 121 56 125 51 125 C46 125 42 121 39 113 C32 96 19 85 4 80 C0 78 -2 76 -2 72 C-2 68 0 66 4 64 C19 59 32 49 39 31 Z" transform="translate(0 0) scale(.48) translate(30 20)"/>
    <text x="58" y="48" font-family="Arial, Helvetica, sans-serif" font-size="21" font-style="italic" font-weight="800" letter-spacing="-1.1">MILION</text>
  </g>
  <g>
    <rect x="237" y="20" width="105" height="38" rx="19" fill="#FFFFFF"/>
    <text x="289.5" y="44" fill="#000000" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Get Started ↗</text>
    <path d="M359 29 H379 M359 38 H379 M359 47 H379" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(0 0)">
    <path fill="#FFFFFF" d="M180 119 C185 105 191 99 195 99 C199 99 205 105 210 119 C224 155 249 175 286 187 C299 191 304 197 304 203 C304 209 299 215 286 219 C249 231 224 251 210 287 C205 301 199 307 195 307 C191 307 185 301 180 287 C166 251 141 231 104 219 C91 215 86 209 86 203 C86 197 91 191 104 187 C141 175 166 155 180 119 Z"/>
    <rect x="169" y="185" width="13" height="29" rx="6.5" fill="#000000"/>
    <rect x="208" y="185" width="13" height="29" rx="6.5" fill="#000000"/>
  </g>
  <text x="195" y="369" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-style="italic" font-weight="900" letter-spacing="-1.6">BEYOND EVERY</text>
  <text x="195" y="411" text-anchor="middle" fill="url(#blue)" font-family="Arial, Helvetica, sans-serif" font-size="38" font-style="italic" font-weight="900" letter-spacing="-1.7">STRATEGY.</text>
  <text x="195" y="454" text-anchor="middle" fill="#D0D0D0" font-family="Arial, Helvetica, sans-serif" font-size="15">
    <tspan x="195" dy="0">Build, backtest, validate, and publish</tspan>
    <tspan x="195" dy="21">trading strategies with leading AI models.</tspan>
  </text>
  <g stroke="#555555" stroke-width="1">
    <path d="M25 566 H91"/>
    <path d="M299 566 H365"/>
  </g>
  <text x="195" y="570" text-anchor="middle" fill="#BDBDBD" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="1.4">WORKS WITH LEADING AI CHAT</text>
  <g fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" text-anchor="middle">
    <text x="48" y="625">ChatGPT</text>
    <text x="108" y="625">Claude</text>
    <text x="168" y="625">Gemini</text>
    <text x="228" y="625">Grok</text>
    <text x="288" y="625">Kimi</text>
